    <path d="M92 316.66 L188 279.94 L284 198.05 L380 94.39 L476 84.59 L572 82.87 L668 80.32 L764 76.40 L860 69.78" fill="none" stroke="#0f7a4f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
