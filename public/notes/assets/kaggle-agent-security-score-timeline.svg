<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">Public score milestones</title>
  <desc id="desc">A line chart showing representative public score milestones rising from 2.700 at v8 to 93.465 at v170.</desc>
  <rect width="960" height="420" fill="#ffffff"/>
  <g font-family="Atkinson, Arial, sans-serif">
