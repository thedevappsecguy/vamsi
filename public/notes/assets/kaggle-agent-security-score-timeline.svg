      <circle cx="380" cy="94.39" r="5"/><circle cx="476" cy="84.59" r="5"/><circle cx="572" cy="82.87" r="5"/>
      <circle cx="668" cy="80.32" r="5"/><circle cx="764" cy="76.40" r="5"/><circle cx="860" cy="69.78" r="7" fill="#f97316" stroke="#f97316"/>
