    <g fill="#3d403d" font-size="13" text-anchor="middle">
      <text x="92" y="352">v8</text><text x="188" y="352">v10</text><text x="284" y="352">v17</text>
      <text x="380" y="352">v30</text><text x="476" y="352">v91</text><text x="572" y="352">v107</text>
