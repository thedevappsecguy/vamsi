# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  pull_request:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

# Grant only the permissions each job needs.
permissions: {}

jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Install build deps
        run: npm ci --ignore-scripts
      - name: Prepare clean site artifact
        run: |
          rm -rf _site
          mkdir -p _site/assets/js
          cp index.html favicon.svg _site/
          cp -r assets/brands _site/assets/
          cp -r assets/fonts _site/assets/
          cp assets/js/react.production.min.js assets/js/react-dom.production.min.js _site/assets/js/
          cp -r notes _site/
      - name: Compile JSX bundle
        run: npm run build:site
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: '_site'

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    concurrency:
      group: "pages"
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
